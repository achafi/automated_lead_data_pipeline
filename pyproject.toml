[project]
name = "business-data-collector"
version = "0.2.0"
description = "Interactive OpenStreetMap business search and CSV demonstration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40,<2",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "folium>=0.20,<1",
    "streamlit-folium>=0.25,<1",
    "rapidfuzz>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
